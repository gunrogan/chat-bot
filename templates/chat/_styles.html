<style>
  /* ---------- Общие игровые анимации ---------- */
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-18px) rotate(5deg); }
  }
  @keyframes pop-in {
    from { transform: scale(.6) translateY(8px); opacity: 0; }
    to   { transform: scale(1) translateY(0);    opacity: 1; }
  }
  @keyframes bounce-dot {
    0%, 80%, 100% { transform: translateY(0); }
    40%           { transform: translateY(-8px); }
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(-24px) rotate(0deg);   opacity: 1; }
    100% { transform: translateY(72vh)  rotate(720deg); opacity: 0; }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }

  .floaty       { position: absolute; opacity: .8; user-select: none; pointer-events: none; animation: floaty 6s ease-in-out infinite; }
  .animate-pop  { animation: pop-in .35s cubic-bezier(.34, 1.56, .64, 1) both; }
  .avatar-pulse { animation: wiggle 3s ease-in-out infinite; }

  .dot          { width: 10px; height: 10px; border-radius: 9999px; animation: bounce-dot 1s infinite ease-in-out; }
  .dot-delay-1  { animation-delay: .15s; }
  .dot-delay-2  { animation-delay: .3s; }

  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 9999px; }
  #messages::-webkit-scrollbar-track { background: transparent; }

  @media (prefers-reduced-motion: reduce) {
    .floaty, .animate-pop, .dot, .avatar-pulse { animation: none; }
  }
</style>
